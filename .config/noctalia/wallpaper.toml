[wallpaper]
enabled = true
fill_mode = "crop"
fill_color = "surface"
transition = ["fade"]
transition_duration = 1200
edge_smoothness = 0.3
transition_on_startup = false
directory = "~/.config/backgrounds/dark"
directory_dark = "~/.config/backgrounds/dark"
directory_light = "~/.config/backgrounds/dark"
per_monitor_directories = false

# NOTE: Noctalia treats wallpaper.default / .last / .monitors as app-managed
# state loaded from ~/.local/state/noctalia/settings.toml (not from this file).
# Keep a mirror here for recovery; do not prune those keys from settings.toml.
[wallpaper.default]
path = "~/.config/backgrounds/dark/dark-starry-sky.jpg"

[wallpaper.last]
path = "~/.config/backgrounds/dark/dark-starry-sky.jpg"

[wallpaper.monitors.eDP-1]
path = "~/.config/backgrounds/dark/dark-starry-sky.jpg"

[wallpaper.monitors.DP-1]
path = "~/.config/backgrounds/dark/dark-starry-sky.jpg"

[wallpaper.automation]
enabled = false
interval_seconds = 1800
order = "random"
recursive = true

[backdrop]
enabled = false
