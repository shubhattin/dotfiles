# Lock screen background rules (Noctalia v5):
# - blurred_desktop = true  → snapshot of live screen (windows included). Not wallpaper.
# - blurred_desktop = false → image background; wallpaper="" uses each output's desktop wallpaper.
# - blur_intensity / tint_intensity always apply to whichever background is active.
# - wallpaper is ignored while blurred_desktop is true.

[lockscreen]
enabled = true
allow_empty_password = false
blurred_desktop = false
blur_intensity = 0.6
tint_intensity = 0.35
fingerprint = false
wallpaper = "~/.config/backgrounds/dark/dark-milky-way.jpg"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "lockscreen-clock@eDP-1",
  "lockscreen-login-box@eDP-1",
  "lockscreen-clock@DP-1",
  "lockscreen-login-box@DP-1",
]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = false

[lockscreen_widgets.widget."lockscreen-clock@eDP-1"]
enabled = true
output = "eDP-1"
type = "clock"
cx = 768.0
cy = 280.0
box_width = 260.0
box_height = 90.0
rotation = 0.0

[lockscreen_widgets.widget."lockscreen-clock@eDP-1".settings]
format = "{:%H:%M}\n{:%a %d %b}"
center_text = true
clock_style = "digital"
color = "on_surface"
shadow = true
font_family = "JetBrainsMono Nerd Font"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
enabled = true
output = "eDP-1"
type = "login_box"
box_width = 400.0
box_height = 70.0
cx = 768.0
cy = 745.0
rotation = 0.0

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
show_caps_lock = true
show_keyboard_layout = false
show_login_button = false
show_password_hint = false

[lockscreen_widgets.widget."lockscreen-clock@DP-1"]
enabled = true
output = "DP-1"
type = "clock"
cx = 960.0
cy = 320.0
box_width = 280.0
box_height = 90.0
rotation = 0.0

[lockscreen_widgets.widget."lockscreen-clock@DP-1".settings]
format = "{:%H:%M}\n{:%a %d %b}"
center_text = true
clock_style = "digital"
color = "on_surface"
shadow = true
font_family = "JetBrainsMono Nerd Font"

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
enabled = true
output = "DP-1"
type = "login_box"
box_width = 400.0
box_height = 70.0
cx = 960.0
cy = 961.0
rotation = 0.0

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
show_caps_lock = true
show_keyboard_layout = false
show_login_button = false
show_password_hint = false
