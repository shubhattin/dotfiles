# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

source=~/.config/hypr/mocha.conf

exec-once = hyprctl setcursor catppuccin-mocha-dark-cursors 28

# Noctalia shell (bar, notifications, OSD, wallpaper, lock/idle)
exec-once = bash ~/.config/hypr/noctalia-wrap.sh
# XDG desktop portals (required for screen share and file pickers)
exec-once = bash ~/.config/hypr/start-portals.sh
# Keep user-systemd/DBus activation env aligned with Hyprland session
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP


# Monitor Config
# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto
monitor=eDP-1,preferred,auto,1.25
monitor=DP-1,1920x1080@75,auto-left,1



# Program Variables
# See https://wiki.hypr.land/Configuring/Keywords/
# Set programs that you use
$terminal = ghostty
$terminal1 = alacritty
$fileManager = dolphin
$fileManager1 = nautilus
$menu = noctalia msg panel-toggle launcher
$noctalia = noctalia msg


xwayland {
    force_zero_scaling = true
}

# Environment Variables
# See https://wiki.hypr.land/Configuring/Environment-variables/
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


