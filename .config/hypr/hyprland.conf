## Map Apps to shortcut
bind = CTRL ALT, F2, exec, zen-browser
bind = CTRL ALT, F3, exec, zen-browser --private-window
bind = SHIFT ALT, V, exec, cursor
bind = SHIFT ALT, C, exec, code
bind = CTRL ALT, B, exec, helium-browser --password-store=basic
bind = CTRL ALT, I, exec, brave --password-store=basic
bind = CTRL ALT, O, exec, helium-browser --password-store=basic --incognito


## Noctalia panels / session
bind = SUPER, V, exec, $noctalia panel-toggle clipboard
bind = SUPER, SPACE, exec, $noctalia panel-toggle launcher
bind = SUPER SHIFT, C, exec, $noctalia panel-toggle control-center
bind = SUPER, comma, exec, $noctalia settings-toggle
bind = SUPER SHIFT, slash, exec, $noctalia panel-toggle shubhattin/keybind_help:help
bind = $mainMod, L, exec, $noctalia session lock
bind = CTRL ALT, DELETE, exec, $noctalia panel-toggle session
bindl = $mainMod SHIFT, F7, exec, $noctalia session lock-and-suspend

# Ozone Wayland Flags
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Shortcuts to take screenshots (hyprshot)
# SUPER + SHIFT + Print : Region selection
bind = $mainMod SHIFT, Print, exec, hyprshot -m region
# SUPER + Print         : Full screen
bind = $mainMod, Print, exec, hyprshot -m output
# SUPER + CTRL + Print  : Window selection
bind = $mainMod CTRL, Print, exec, hyprshot -m window


# Typing methods setup
exec-once = fcitx5 -d
# env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

## Dolphin fix
env = XDG_MENU_PREFIX,arch-
# Polkit Setup
exec-once = /usr/lib/polkit-kde-authentication-agent-1
